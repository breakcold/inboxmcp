name: Publish Official MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install verified publisher
        run: |
          curl --fail --location --retry 3 https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz --output publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar xzf publisher.tar.gz mcp-publisher
      - name: Authenticate as this repository
        run: ./mcp-publisher login github-oidc
      - name: Publish metadata
        run: ./mcp-publisher publish server.json
      - name: Verify published version
        run: |
          curl --fail --location --retry 3 'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.breakcold%2Finboxmcp/versions/1.0.0' --output published.json
          jq --exit-status '.server.name == "io.github.breakcold/inboxmcp" and .server.version == "1.0.0" and .server.remotes[0].url == "https://inbox-mcp.com/mcp"' published.json
